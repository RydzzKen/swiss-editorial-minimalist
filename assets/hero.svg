<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Swiss-editorial Minimalist</title>
  <desc id="d">Title card for the Swiss-editorial Minimalist SKILL.md: large negative-tracked heading on an off-white page beside a dark panel listing the five neutral colour tokens of the palette.</desc>
  <rect width="1200" height="420" rx="4" fill="#f5f5f5"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="4" fill="none" stroke="#e0e0e0"/>

  <g id="title-block" transform="translate(64 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="0" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2.6" fill="#666666">01 / AI SKILL · ART DIRECTION</text>
    <text x="0" y="178" font-size="84" font-weight="500" letter-spacing="-5" fill="#111111">Swiss-editorial</text>
    <text x="0" y="262" font-size="84" font-weight="500" letter-spacing="-5" fill="#111111">Minimalist<tspan fill="#666666">.</tspan></text>
    <text x="0" y="318" font-size="22" fill="#666666">One SKILL.md that makes an AI build monochrome,</text>
    <text x="0" y="348" font-size="22" fill="#666666">editorial pages, not the average gradient page.</text>
    <line x1="0" y1="376" x2="632" y2="376" stroke="#e0e0e0"/>
    <text x="0" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#666666">v3.1 · RydzzKen · one HTML file out</text>
  </g>

  <g id="token-panel" transform="translate(744 40)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="392" height="340" rx="4" fill="#0a0a0a"/>
    <text x="28" y="46" font-size="16" font-weight="700" letter-spacing="2.6" fill="#999999">:ROOT</text>
    <line x1="28" y1="66" x2="364" y2="66" stroke="#333333"/>
    <g font-size="20" fill="#f0f0f0">
      <rect x="28" y="88" width="28" height="28" fill="#f5f5f5"/>
      <text x="72" y="110">--bg</text><text x="364" y="110" text-anchor="end" fill="#999999">#f5f5f5</text>
      <rect x="28" y="130" width="28" height="28" fill="#111111" stroke="#555555"/>
      <text x="72" y="152">--ink</text><text x="364" y="152" text-anchor="end" fill="#999999">#111111</text>
      <rect x="28" y="172" width="28" height="28" fill="#666666"/>
      <text x="72" y="194">--muted</text><text x="364" y="194" text-anchor="end" fill="#999999">#666666</text>
      <rect x="28" y="214" width="28" height="28" fill="#e0e0e0"/>
      <text x="72" y="236">--line</text><text x="364" y="236" text-anchor="end" fill="#999999">#e0e0e0</text>
      <rect x="28" y="256" width="28" height="28" fill="#eeeeee"/>
