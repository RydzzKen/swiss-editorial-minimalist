<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">What changes with the Swiss-editorial Minimalist skill</title>
  <desc id="d">Comparison table in seven rows: background, text, corners, depth, status, headings and tooling, each showing the usual model default struck through beside the rule this skill enforces.</desc>
  <rect width="1200" height="740" rx="4" fill="#f5f5f5"/>
  <rect x="0.5" y="0.5" width="1199" height="739" rx="4" fill="none" stroke="#e0e0e0"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2.6" fill="#666666">02 / WHAT CHANGES</text>
    <text x="64" y="132" font-size="52" font-weight="500" letter-spacing="-2.6" fill="#111111">Decisions, not defaults<tspan fill="#666666">.</tspan></text>
    <text x="224" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2.6" fill="#666666">AVERAGE MODEL PAGE</text>
    <text x="596" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2.6" fill="#666666">WITH SKILL.MD</text>
    <line x1="64" y1="222" x2="1136" y2="222" stroke="#111111"/>
    <text x="64" y="264" font-size="20" fill="#666666">Background</text>
    <text x="224" y="264" font-size="22" fill="#666666" text-decoration="line-through">#fff or a gradient</text>
    <text x="560" y="264" font-size="22" font-weight="500" fill="#111111">→</text>
    <text x="596" y="264" font-size="22" font-weight="500" fill="#111111">#f5f5f5 off-white</text>
    <line x1="64" y1="288" x2="1136" y2="288" stroke="#e0e0e0"/>
    <text x="64" y="330" font-size="20" fill="#666666">Text</text>
    <text x="224" y="330" font-size="22" fill="#666666" text-decoration="line-through">#000</text>
    <text x="560" y="330" font-size="22" font-weight="500" fill="#111111">→</text>
    <text x="596" y="330" font-size="22" font-weight="500" fill="#111111">#111111 off-black</text>
    <line x1="64" y1="354" x2="1136" y2="354" stroke="#e0e0e0"/>
    <text x="64" y="396" font-size="20" fill="#666666">Corners</text>
    <text x="224" y="396" font-size="22" fill="#666666" text-decoration="line-through">16px+ rounded cards</text>
    <text x="560" y="396" font-size="22" font-weight="500" fill="#111111">→</text>
    <text x="596" y="396" font-size="22" font-weight="500" fill="#111111">4px at most</text>
    <line x1="64" y1="420" x2="1136" y2="420" stroke="#e0e0e0"/>
    <text x="64" y="462" font-size="20" fill="#666666">Depth</text>
    <text x="224" y="462" font-size="22" fill="#666666" text-decoration="line-through">box-shadow</text>
    <text x="560" y="462" font-size="22" font-weight="500" fill="#111111">→</text>
    <text x="596" y="462" font-size="22" font-weight="500" fill="#111111">1px solid var(--line)</text>
    <line x1="64" y1="486" x2="1136" y2="486" stroke="#e0e0e0"/>
    <text x="64" y="528" font-size="20" fill="#666666">Status</text>
    <text x="224" y="528" font-size="22" fill="#666666" text-decoration="line-through">emerald-500, #27c93f</text>
    <text x="560" y="528" font-size="22" font-weight="500" fill="#111111">→</text>
    <text x="596" y="528" font-size="22" font-weight="500" fill="#111111">● ▲ ✕ → in --ink</text>
    <line x1="64" y1="552" x2="1136" y2="552" stroke="#e0e0e0"/>
    <text x="64" y="594" font-size="20" fill="#666666">Headings</text>
    <text x="224" y="594" font-size="22" fill="#666666" text-decoration="line-through">bold 700, normal tracking</text>
    <text x="560" y="594" font-size="22" font-weight="500" fill="#111111">→</text>
    <text x="596" y="594" font-size="22" font-weight="500" fill="#111111">500, −0.04 to −0.07em</text>
    <line x1="64" y1="618" x2="1136" y2="618" stroke="#e0e0e0"/>
    <text x="64" y="660" font-size="20" fill="#666666">Tooling</text>
    <text x="224" y="660" font-size="22" fill="#666666" text-decoration="line-through">Tailwind CDN</text>
    <text x="560" y="660" font-size="22" font-weight="500" fill="#111111">→</text>
    <text x="596" y="660" font-size="22" font-weight="500" fill="#111111">vanilla CSS, :root tokens</text>
    <line x1="64" y1="684" x2="1136" y2="684" stroke="#e0e0e0"/>
  </g>
</svg>
